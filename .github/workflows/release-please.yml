name: release-please

# Merging to main never changes the version. release-please keeps a Release PR
# open; merging that PR is what cuts a release (tag + GitHub release).
on:
  push:
    branches:
      - main
  # Rehearse, or repeat, attaching the files to an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to (for example v2.0.0)'
        required: true
      dry_run:
        description: 'Build and check the files but do not upload them'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only rewrites versions, so the end of the copyright range
      # in the licence notice is set here, on the Release PR's own branch.
      - name: Check out the Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set the copyright year
        if: ${{ steps.release.outputs.pr != '' }}
        run: |
          sh bin/update-copyright-year.sh "$(date +%Y)"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: set the copyright year to $(date +%Y)"
            git push
          fi

  # The single file, for people who do not use Composer. Built from the tag, so it
  # is the file that was released, and checked against the tag's version.
  assets:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Attach object-cache.php and its checksum to the release
        run: sh bin/release-assets.sh "$TAG" "$DRY_RUN"
